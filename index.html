<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>ConstructDirect — Factory-Direct Construction Materials</title>
    <meta name="title" content="ConstructDirect — Factory-Direct Construction Materials" />
    <meta name="description" content="Buy tile, cabinets, flooring, lighting, plumbing and more direct from verified manufacturers. 40–65% below big-box retail. Free freight quotes. AI plan-to-BOM matching." />
    <meta name="keywords" content="factory direct construction materials, wholesale tile, wholesale cabinets, bulk flooring, contractor supply, construction materials marketplace" />
    <meta name="author" content="ConstructDirect" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://constructdirect.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://constructdirect.com/" />
    <meta property="og:title" content="ConstructDirect — Factory-Direct Construction Materials" />
    <meta property="og:description" content="Buy tile, cabinets, flooring, lighting, plumbing and more direct from verified manufacturers. 40–65% below big-box retail." />
    <meta property="og:image" content="https://constructdirect.com/og-image.jpg" />
    <meta property="og:site_name" content="ConstructDirect" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://constructdirect.com/" />
    <meta name="twitter:title" content="ConstructDirect — Factory-Direct Construction Materials" />
    <meta name="twitter:description" content="Buy tile, cabinets, flooring, lighting, plumbing and more direct from verified manufacturers. 40–65% below big-box retail." />
    <meta name="twitter:image" content="https://constructdirect.com/og-image.jpg" />
    <meta name="twitter:site" content="@ConstructDirect" />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "ConstructDirect",
      "url": "https://constructdirect.com",
      "description": "Factory-direct construction materials marketplace connecting contractors and homeowners with verified manufacturers.",
      "sameAs": [],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "availableLanguage": "English"
      }
    }
    </script>

    <!-- Structured Data: WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ConstructDirect",
      "url": "https://constructdirect.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://constructdirect.com/marketplace?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Google Analytics 4 (GA4) — replaced at runtime by admin config -->
    <script id="ga4-script">/* GA4 tracking ID configured via Admin SEO panel */</script>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
