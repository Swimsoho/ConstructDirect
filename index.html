<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>MaterialFaire — MVP Execution Tracker</title>
<style>
:root{
  color-scheme: light;
  --bg:#f7f6f3; --panel:#fff; --ink:#1c1b19; --muted:#6f6b64; --line:#e4e1da;
  --accent:#8a5a2b; --accent-soft:#f2ebe2;
  --green:#2f7d4f; --amber:#b57e12; --slate:#5b6470; --red:#b3452f;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);padding:20px;
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1280px;margin:0 auto}

header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.2px}
.sub{color:var(--muted);font-size:13px;margin:0}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:84px}
.kpi b{display:block;font-size:19px;line-height:1.1}
.kpi span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:14px 0 16px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#c08b53);width:0;transition:width .3s}

.banner{border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:13px;border:1px solid}
.banner.warn{background:#fdf8ec;border-color:#f0e3c6;color:#7a5a10}
.banner.err{background:#fdf2ef;border-color:#f0d6cf;color:#8f3624}
.banner code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px;font-size:12px}
.banner b{display:block;margin-bottom:4px}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
select,input[type=text],input[type=date]{font:inherit;color:inherit;background:var(--panel);
  border:1px solid var(--line);border-radius:7px;padding:5px 8px}
select:focus,input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.btn{font:inherit;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 12px;cursor:pointer}
.btn:hover{background:var(--accent-soft);border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:default}
.spacer{flex:1}
.hint{font-size:12px;color:var(--muted)}
.who{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.who input{width:110px}

.dot{width:8px;height:8px;border-radius:99px;display:inline-block;background:var(--slate)}
.dot.ok{background:var(--green)} .dot.bad{background:var(--red)} .dot.busy{background:var(--amber)}

section.ws{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.ws-head{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);background:#fcfbf9}
.ws-head h2{font-size:14px;margin:0;letter-spacing:.02em;text-transform:uppercase;color:var(--accent)}
.ws-count{font-size:12px;color:var(--muted)}
.ws-bar{height:5px;background:var(--line);border-radius:99px;width:110px;overflow:hidden}
.ws-bar>i{display:block;height:100%;background:var(--accent);width:0}

table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;
  padding:8px 10px;font-weight:600;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid #f0eee9;vertical-align:top}
tr:last-child td{border-bottom:none}
tr.done .task-title{text-decoration:line-through;color:var(--muted)}
tr.blocked{background:#fdfbf7}
tr.saving{opacity:.55}

.task-title{font-weight:600;display:block}
.task-desc{color:var(--muted);font-size:12.5px;margin-top:2px;display:block}
.dep{display:inline-block;margin-top:5px;font-size:11px;color:var(--red);background:#fdf1ee;
  border:1px solid #f2ded8;border-radius:5px;padding:1px 6px}
.dep.ok{color:var(--green);background:#eef6f0;border-color:#d9ebe0}

.pill{font-size:11px;border-radius:99px;padding:2px 9px;border:1px solid;white-space:nowrap;display:inline-block}
.p-P1{color:var(--red);border-color:#f0d6cf;background:#fdf2ef}
.p-P2{color:var(--amber);border-color:#f0e3c6;background:#fdf8ec}
.p-P3{color:var(--slate);border-color:#dfe3e8;background:#f5f7f9}

select.status{font-size:12px;font-weight:600;border-radius:99px;padding:3px 8px}
select.status[data-v="Not started"]{color:var(--slate);background:#f4f5f7}
select.status[data-v="In progress"]{color:var(--amber);background:#fdf8ec}
select.status[data-v="Blocked"]{color:var(--red);background:#fdf2ef}
select.status[data-v="Done"]{color:var(--green);background:#eef6f0}

input.owner{width:118px} input.due{width:132px} input.note{width:100%;min-width:140px}
td.num{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap;cursor:help}
.phase{font-size:11px;color:var(--muted);white-space:nowrap}

footer{color:var(--muted);font-size:12px;margin-top:18px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
@media (max-width:820px){ .task-desc{display:none} }
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <div>
    <h1>MaterialFaire — MVP Execution Tracker</h1>
    <p class="sub">Shared board. Every change saves to Supabase and shows up for everyone.</p>
  </div>
  <div class="kpis">
    <div class="kpi"><b id="k-total">–</b><span>Tasks</span></div>
    <div class="kpi"><b id="k-done">–</b><span>Done</span></div>
    <div class="kpi"><b id="k-prog">–</b><span>In progress</span></div>
    <div class="kpi"><b id="k-unassigned">–</b><span>Unassigned</span></div>
    <div class="kpi"><b id="k-p1">–</b><span>P1 open</span></div>
  </div>
</header>

<div class="bar"><i id="progbar"></i></div>

<div id="banner"></div>

<div class="toolbar">
  <select id="f-phase"><option value="">All phases</option></select>
  <select id="f-owner"><option value="">All owners</option></select>
  <select id="f-status"><option value="">All statuses</option></select>
  <select id="f-prio"><option value="">All priorities</option></select>
  <label class="hint"><input type="checkbox" id="f-hidedone"> hide done</label>
  <div class="spacer"></div>
  <span class="who">you are <input type="text" id="me" placeholder="your name"></span>
  <button class="btn" id="btn-refresh">Refresh</button>
  <button class="btn" id="btn-csv">Export CSV</button>
</div>

<div id="board"></div>

<footer>
  <span><span class="dot" id="conn"></span> <span id="conn-text">connecting…</span></span>
  <span>P1 = must happen for the pilot · P2 = important, can trail · P3 = nice to have</span>
</footer>

</div>

<datalist id="ownerlist"></datalist>

<script>
/* ============================================================
   1. CONFIG — paste your two Supabase values here, then deploy.
   Supabase dashboard → Project Settings → API
   ============================================================ */
const SUPABASE_URL      = "https://xbncrbnofjaofnychkmj.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhibmNyYm5vZmphb2ZueWNoa21qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNjMyOTksImV4cCI6MjEwMjgzOTI5OX0.PW1ZLLI0i82PFR1BW9mhkeUx37E4BpIVBUMs9ExLpUY";
/* ============================================================ */

const REST = SUPABASE_URL + "/rest/v1/tasks";
const H = {
  "apikey": eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpmc2JsdHhybmNuZ2V6dmt3dHFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNTk2NTAsImV4cCI6MjEwMjgzNTY1MH0.F4x04Y8TcEHmUpsHV0dcOQuujObzIrX16cCb4z-_fwE,
  "Authorization": "Bearer " + eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpmc2JsdHhybmNuZ2V6dmt3dHFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNTk2NTAsImV4cCI6MjEwMjgzNTY1MH0.F4x04Y8TcEHmUpsHV0dcOQuujObzIrX16cCb4z-_fwE,
  "Content-Type": "application/json"
};
const configured = !SUPABASE_URL.includes("https://xbncrbnofjaofnychkmj.supabase.co") && !SUPABASE_ANON_KEY.includes("eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhibmNyYm5vZmphb2ZueWNoa21qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNjMyOTksImV4cCI6MjEwMjgzOTI5OX0.PW1ZLLI0i82PFR1BW9mhkeUx37E4BpIVBUMs9ExLpUY");

const WS_ORDER = ["Foundation","Platform","Supply Side","Demand Side","Funding"];
const STATUSES = ["Not started","In progress","Blocked","Done"];
const PRIOS    = ["P1","P2","P3"];

/* ---- Seed rows (inserted once via the Seed button) ---- */
const SEED = [
 {id:"F1", ws:"Foundation", phase:"Phase 1 · Weeks 1–3", prio:"P1", deps:[], sort_order:10,
  title:"Incorporate in Delaware",
  descr:"C-corp formation, EIN, registered agent, founder stock + vesting, bank account."},
 {id:"F2", ws:"Foundation", phase:"Phase 1 · Weeks 1–3", prio:"P1", deps:[], sort_order:20,
  title:"Assign core areas and responsibilities among founders",
  descr:"Who owns supply, demand, platform, and finance. Write it down — it drives every owner field below."},
 {id:"F3", ws:"Foundation", phase:"Phase 1 · Weeks 1–3", prio:"P1", deps:["F2"], sort_order:30,
  title:"Select initial focus categories",
  descr:"Flooring, cabinetry/kitchen, outdoor. Locks scope for vendor recruiting, pricing model, and GC pitch."},
 {id:"F4", ws:"Foundation", phase:"Phase 1 · Weeks 1–3", prio:"P2", deps:["F1"], sort_order:40,
  title:"Set up email and shared workspace",
  descr:"Domain, founder mailboxes, shared drive, doc templates. Needed before any external outreach."},

 {id:"P1", ws:"Platform", phase:"Phase 2 · Weeks 3–9", prio:"P1", deps:["F3"], sort_order:110,
  title:"Build the landed-price model",
  descr:"One final delivered price per destination, Amazon/Alibaba style. Backend components: FOB, duty/tariff, ocean freight, customs, last-mile delivery. Decide margin logic and who sees the breakdown."},
 {id:"P2", ws:"Platform", phase:"Phase 2 · Weeks 3–9", prio:"P1", deps:["F3"], sort_order:120,
  title:"Finalize the vendor portal",
  descr:"Onboarding, catalog upload, spec/photo requirements, inventory + lead times, order acceptance, comms."},
 {id:"P3", ws:"Platform", phase:"Phase 2 · Weeks 3–9", prio:"P1", deps:["P1","P2"], sort_order:130,
  title:"Finalize the product display page",
  descr:"Spec sheet, imagery, delivered price, lead time, minimums, comparable-product framing."},
 {id:"P4", ws:"Platform", phase:"Phase 3 · Weeks 9–14", prio:"P1", deps:["P3"], sort_order:140,
  title:"Test the full design-to-order flow",
  descr:"Walk a real project end to end: selection → quote → PO → vendor acceptance → delivery. Log every break point."},
 {id:"P5", ws:"Platform", phase:"Phase 3 · Weeks 9–16", prio:"P2", deps:["P4"], sort_order:150,
  title:"Build the GC/Designer Command Center",
  descr:"Projects, quotes, purchase orders, vendor communication, photos + quality management, delivery tracking, financials. Scope hard — ship the three modules a pilot GC actually needs first."},

 {id:"S1", ws:"Supply Side", phase:"Phase 1 · Weeks 2–5", prio:"P1", deps:["F3"], sort_order:210,
  title:"Finalize the founding-vendor presentation",
  descr:"The pitch: why list with us, what we handle, what founding terms look like, what we need from them."},
 {id:"S2", ws:"Supply Side", phase:"Phase 2 · Weeks 3–7", prio:"P1", deps:["F1"], sort_order:220,
  title:"Develop a simplified supply agreement",
  descr:"Short-form founding-vendor terms: pricing, exclusivity (or not), quality standards, lead times, defects/returns, termination."},
 {id:"S3", ws:"Supply Side", phase:"Phase 2 · Weeks 5–12", prio:"P1", deps:["S1","S2"], sort_order:230,
  title:"Approach founding suppliers and onboard for testing",
  descr:"Target a small number per category. Onboard, load catalogs, run them through platform testing, adjust before scaling."},

 {id:"D1", ws:"Demand Side", phase:"Phase 1 · Weeks 1–4", prio:"P1", deps:[], sort_order:310,
  title:"Map competing models in the market",
  descr:"BuildDirect, Kojo (UseKojo.com), Artisan Design Group, and adjacent centralized contractor platforms. What they price, who they serve, where they leave a gap."},
 {id:"D2", ws:"Demand Side", phase:"Phase 2 · Weeks 4–12", prio:"P1", deps:["D1","S1"], sort_order:320,
  title:"Reach out to GCs — present concept, gather feedback, validate demand",
  descr:"Structured conversations, consistent question set. Goal: written signals of intent from pilot GCs before the platform is finished."},

 {id:"FU1", ws:"Funding", phase:"Phase 3 · Weeks 10–16", prio:"P2", deps:["D2","S3"], sort_order:410,
  title:"Strategize funding timeline and potential partners",
  descr:"How much, when, from whom. Which pilot metrics need to exist first — GC intent, vendor count, completed test orders."}
];

let state = [];
let inflight = new Set();

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const me = () => ($("me").value||"").trim();

function conn(kind,text){
  $("conn").className = "dot " + kind;
  $("conn-text").textContent = text;
}
function banner(html){ $("banner").innerHTML = html || ""; }

/* ---------- data ---------- */
async function fetchTasks(){
  const r = await fetch(REST + "?select=*&order=sort_order.asc", {headers:H});
  if(!r.ok) throw new Error("HTTP " + r.status + " — " + (await r.text()).slice(0,180));
  return r.json();
}

async function patchTask(id, patch){
  const body = Object.assign({}, patch, {updated_by: me() || "someone"});
  const r = await fetch(REST + "?id=eq." + encodeURIComponent(id), {
    method:"PATCH", headers:Object.assign({}, H, {"Prefer":"return=representation"}),
    body: JSON.stringify(body)
  });
  if(!r.ok) throw new Error("HTTP " + r.status + " — " + (await r.text()).slice(0,180));
  const rows = await r.json();
  return rows[0];
}

async function seed(){
  const rows = SEED.map(t=>Object.assign({}, t, {
    status:"Not started", owner:"", due:null, note:"", updated_by: me()||"setup"
  }));
  const r = await fetch(REST, {
    method:"POST",
    headers:Object.assign({}, H, {"Prefer":"resolution=merge-duplicates,return=minimal"}),
    body: JSON.stringify(rows)
  });
  if(!r.ok) throw new Error("HTTP " + r.status + " — " + (await r.text()).slice(0,180));
}

async function load(quiet){
  if(!configured){
    conn("bad","not configured");
    banner('<div class="banner err"><b>Supabase not configured</b>'+
      'Open <code>index.html</code>, paste your <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> '+
      'near the top of the script block, then redeploy. Both values live in Supabase → Project Settings → API.</div>');
    return;
  }
  if(!quiet) conn("busy","loading…");
  try{
    state = await fetchTasks();
    if(!state.length){
      banner('<div class="banner warn"><b>Table is empty</b>'+
        'Load the 15 starting tasks. Safe to click more than once — existing rows are left alone. '+
        '<button class="btn primary" id="btn-seed" style="margin-top:8px">Seed tasks</button></div>');
      const b = $("btn-seed");
      if(b) b.onclick = async ()=>{
        b.disabled = true; b.textContent = "Seeding…";
        try{ await seed(); banner(""); await load(); }
        catch(e){ fail(e); }
      };
    } else banner("");
    conn("ok","live · synced " + new Date().toLocaleTimeString());
    render();
  }catch(e){ fail(e); }
}

function fail(e){
  conn("bad","error");
  banner('<div class="banner err"><b>Could not reach Supabase</b>'+esc(e.message)+
    '<br>Check the URL and anon key, that the <code>tasks</code> table exists, and that the RLS policies from '+
    '<code>schema.sql</code> were applied.</div>');
  console.error(e);
}

/* ---------- rendering ---------- */
function owners(){ return [...new Set(state.map(t=>t.owner).filter(Boolean))].sort(); }
function depsMet(t){
  return (t.deps||[]).every(d=>{ const x = state.find(y=>y.id===d); return x && x.status==="Done"; });
}
function visible(t){
  const p=$("f-phase").value, o=$("f-owner").value, s=$("f-status").value, r=$("f-prio").value;
  if(p && t.phase!==p) return false;
  if(o && t.owner!==o) return false;
  if(s && t.status!==s) return false;
  if(r && t.prio!==r) return false;
  if($("f-hidedone").checked && t.status==="Done") return false;
  return true;
}
function syncSelect(id,allLabel,vals){
  const sel=$(id), cur=sel.value;
  sel.innerHTML = '<option value="">'+allLabel+'</option>' +
    vals.map(v=>'<option '+(v===cur?"selected":"")+'>'+esc(v)+'</option>').join("");
  sel.value = vals.includes(cur) ? cur : "";
}

function render(){
  syncSelect("f-phase","All phases",[...new Set(state.map(t=>t.phase))]);
  syncSelect("f-owner","All owners",owners());
  syncSelect("f-status","All statuses",STATUSES);
  syncSelect("f-prio","All priorities",PRIOS);
  $("ownerlist").innerHTML = owners().map(o=>'<option value="'+esc(o)+'">').join("");

  const board = $("board");
  board.innerHTML = "";

  WS_ORDER.forEach(ws=>{
    const all  = state.filter(t=>t.ws===ws);
    const rows = all.filter(visible);
    if(!rows.length) return;
    const done = all.filter(t=>t.status==="Done").length;
    const pct  = all.length ? Math.round(done/all.length*100) : 0;

    const sec = document.createElement("section");
    sec.className = "ws";
    sec.innerHTML =
      '<div class="ws-head"><h2>'+esc(ws)+'</h2>'+
      '<span class="ws-count">'+done+' of '+all.length+' done</span>'+
      '<div class="ws-bar"><i style="width:'+pct+'%"></i></div></div>'+
      '<table><thead><tr>'+
        '<th style="width:44px">ID</th><th>Task</th>'+
        '<th style="width:112px">Status</th><th style="width:126px">Owner</th>'+
        '<th style="width:62px">Priority</th><th style="width:142px">Target</th>'+
        '<th style="width:150px">Phase</th><th style="width:180px">Notes</th>'+
      '</tr></thead><tbody></tbody></table>';
    const tb = sec.querySelector("tbody");

    rows.forEach(t=>{
      const met = depsMet(t);
      const tr = document.createElement("tr");
      tr.className = (t.status==="Done" ? "done " : "") +
                     ((!met && t.status!=="Done") ? "blocked " : "") +
                     (inflight.has(t.id) ? "saving" : "");
      const dep = (t.deps && t.deps.length)
        ? '<span class="dep '+(met?"ok":"")+'">'+(met?"✓ ready — ":"waiting on ")+t.deps.join(", ")+'</span>' : "";
      const stamp = t.updated_by
        ? "last change by "+t.updated_by+" · "+new Date(t.updated_at).toLocaleString()
        : "no changes yet";

      tr.innerHTML =
        '<td class="num" title="'+esc(stamp)+'">'+esc(t.id)+'</td>'+
        '<td><span class="task-title">'+esc(t.title)+'</span>'+
            '<span class="task-desc">'+esc(t.descr)+'</span>'+dep+'</td>'+
        '<td><select class="status" data-f="status" data-v="'+esc(t.status)+'">'+
            STATUSES.map(s=>'<option '+(s===t.status?"selected":"")+'>'+s+'</option>').join("")+'</select></td>'+
        '<td><input class="owner" data-f="owner" list="ownerlist" placeholder="—" value="'+esc(t.owner)+'"></td>'+
        '<td><span class="pill p-'+esc(t.prio)+'">'+esc(t.prio)+'</span></td>'+
        '<td><input class="due" type="date" data-f="due" value="'+esc(t.due||"")+'"></td>'+
        '<td class="phase">'+esc(t.phase)+'</td>'+
        '<td><input class="note" data-f="note" placeholder="—" value="'+esc(t.note)+'"></td>';

      tr.querySelectorAll("[data-f]").forEach(el=>{
        el.addEventListener("change", async ()=>{
          const field = el.dataset.f;
          let val = el.value;
          if(field==="due" && val==="") val = null;
          const prev = t[field];
          if(val === prev) return;
          t[field] = val;
          inflight.add(t.id); render();
          try{
            const updated = await patchTask(t.id, {[field]: val});
            if(updated) Object.assign(t, updated);
            conn("ok","live · saved " + new Date().toLocaleTimeString());
          }catch(e){
            t[field] = prev;
            fail(e);
          }finally{
            inflight.delete(t.id); render();
          }
        });
      });
      tb.appendChild(tr);
    });
    board.appendChild(sec);
  });

  const total = state.length, done = state.filter(t=>t.status==="Done").length;
  $("k-total").textContent = total;
  $("k-done").textContent  = done;
  $("k-prog").textContent  = state.filter(t=>t.status==="In progress").length;
  $("k-unassigned").textContent = state.filter(t=>!t.owner && t.status!=="Done").length;
  $("k-p1").textContent    = state.filter(t=>t.prio==="P1" && t.status!=="Done").length;
  $("progbar").style.width = (total ? Math.round(done/total*100) : 0) + "%";
}

/* ---------- wiring ---------- */
["f-phase","f-owner","f-status","f-prio","f-hidedone"].forEach(id=>$(id).addEventListener("change",render));

$("me").value = localStorage.getItem("mf-me") || "";
$("me").addEventListener("change", ()=>localStorage.setItem("mf-me", me()));

$("btn-refresh").addEventListener("click", ()=>load());

$("btn-csv").addEventListener("click", ()=>{
  const head=["ID","Workstream","Task","Description","Status","Owner","Priority","Target date","Phase","Depends on","Notes","Last change by","Last change"];
  const q = s => '"' + String(s==null?"":s).replace(/"/g,'""') + '"';
  const csv = [head.map(q).join(",")].concat(state.map(t=>
    [t.id,t.ws,t.title,t.descr,t.status,t.owner,t.prio,t.due||"",t.phase,(t.deps||[]).join(" "),t.note,t.updated_by,t.updated_at]
    .map(q).join(","))).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿"+csv], {type:"text/csv;charset=utf-8"}));
  a.download = "materialfaire-tracker.csv";
  a.click();
});

// keep the board fresh without stepping on someone mid-edit
setInterval(()=>{ if(!inflight.size && !document.activeElement.matches("input,select")) load(true); }, 20000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) load(true); });

load();
</script>
